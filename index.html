<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muscle Mix</title>
<link rel="apple-touch-icon" href="muscle-mix-icon-180.png">
<meta name="apple-mobile-web-app-title" content="Muscle Mix">
<meta name="mm-version" content="2026-11-23-1">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#1C1B17;--panel:#26251f;--line:#3a382f;--gold:#DB9928;--gold-d:rgba(219,153,40,.55);--text:#FAF7F0;--mute:#CDC7B8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:500px){#app{height:min(100dvh,880px);margin-top:max(0px,calc((100dvh - 880px)/2));border:1px solid var(--line);border-radius:28px}}
header.top{padding:calc(16px + env(safe-area-inset-top)) 20px 12px;border-bottom:1px solid var(--line);flex:none}
header.top h1{margin:0;line-height:0}header.top .logo{height:46px;width:auto;display:block}
main{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;padding:20px 20px 28px;display:none}
.screen.on{display:block}
h2{font-size:24px;color:var(--gold);margin:0 0 14px;line-height:1.2}
.section-label{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 14px}
p{font-size:18px;line-height:1.45;margin:0 0 12px}
.rule{background:var(--panel);border:1px solid var(--gold-d);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.rule .asklink{padding:6px 0 4px;font-size:17px}
.rule .rx{font-size:26px;font-weight:800;line-height:1.1;color:var(--gold);margin:0 0 8px}
.rule p{margin:0 0 8px}
.ph{border:2px dashed rgba(205,199,184,.5);border-radius:10px;padding:10px 12px;color:#CDC7B8;background:rgba(219,153,40,.07);font-size:15px;line-height:1.35;font-style:italic}
.row{display:flex;gap:14px;align-items:center;width:100%;min-height:92px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px;color:var(--text);font:inherit;cursor:pointer}
.row:active{border-color:var(--gold)}
.thumb{flex:none;width:72px;height:72px;border-radius:12px;background:repeating-linear-gradient(45deg,#2b2a24,#2b2a24 8px,#23221d 8px,#23221d 16px);border:1px solid #3a382f;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute)}
.row .info{flex:1;min-width:0}
.row .num{color:var(--gold);font-weight:800;font-size:15px}
.row .name{font-size:20px;font-weight:700;line-height:1.2}
.row .ph{margin-top:6px;padding:4px 8px;font-size:13px}
.vthumb{flex:none;width:56px;height:56px;border-radius:10px;object-fit:cover;background:#2b2a24;border:1px solid #3a382f}
.chev{flex:none;color:var(--gold);font-size:26px;padding-right:4px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:20px}
.seg button{flex:1;min-height:60px;border:0;border-radius:10px;background:transparent;color:var(--mute);font:inherit;font-size:16px;line-height:1.15;padding:4px 6px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--gold);color:#1C1B17}
.group h3{font-size:20px;color:var(--gold);margin:20px 0 10px;text-transform:uppercase;letter-spacing:1.5px}
.group .row{min-height:72px}
.group .row .name{font-size:20px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.q h3{margin:0 0 8px;font-size:21px;line-height:1.25;color:var(--gold)}
.q p{margin:0 0 10px}
.link{display:flex;align-items:center;justify-content:center;min-height:52px;width:100%;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px}
.link{text-decoration:none}
.mcard{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 10px 4px 0;margin-bottom:10px}
.mcard .row{flex:1;min-width:0;min-height:72px;margin:0;border:0;background:transparent;padding:8px 6px 8px 14px}
.mcard .swapbtn{flex:none;margin:0;min-height:48px;padding:0 16px}
.swapbtn{display:block;min-height:48px;margin:-4px 0 12px auto;padding:0 22px;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.swapbtn.on{background:var(--gold);color:#1C1B17}
.swappanel{display:none;margin:0 0 16px;padding:0 0 4px 12px;border-left:3px solid var(--gold-d)}
.swappanel.on{display:block}
.swappanel .row{min-height:64px;margin-bottom:10px}
.swappanel .ph{margin-bottom:10px}
.swappanel p{font-size:17px}
.link:active{background:var(--gold);color:#1C1B17}
#move{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:12px 20px 28px;display:none;z-index:5}
#move.on{display:block}
.back{display:flex;align-items:center;gap:6px;min-height:52px;padding:0 18px 0 10px;margin:0 0 12px -6px;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);font:inherit;font-size:19px;font-weight:700;cursor:pointer}
.yt{margin:0 0 20px;text-align:center}
.ytbox{position:relative;width:min(100%,300px);aspect-ratio:9/16;margin:0 auto;background:#000;border:1px solid #333;border-radius:14px;overflow:hidden}
.ytbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytlink{display:inline-block;margin-top:10px;font-size:15px;color:var(--gold);text-decoration:underline}
#overlay{position:absolute;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:16px 20px 28px;display:none}
#overlay.on{display:block}
#overlay iframe{display:block;width:100%;height:520px;border:0;background:transparent}
.hs-icon{display:block;width:84px;height:84px;border-radius:18px;margin:4px 0 14px}
.steps{margin:0 0 14px;padding-left:26px}
.steps li{margin:0 0 10px;font-size:18px;line-height:1.4}
.hs h4{margin:14px 0 8px;font-size:17px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.askline{margin:22px 0 6px;text-align:center}
.asklink{background:none;border:0;color:var(--gold);font:inherit;font-size:16px;text-decoration:underline;padding:12px;cursor:pointer}
.lab{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin:18px 0 6px}
.big{font-size:21px;line-height:1.4;margin:0}
nav{flex:none;display:flex;border-top:1px solid var(--line);background:#0f0f0f;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;font-weight:700;letter-spacing:0;cursor:pointer}
nav button svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
#toast{position:absolute;left:20px;right:20px;bottom:96px;background:var(--gold);color:#1C1B17;font-weight:700;font-size:16px;padding:12px 14px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
.bodymap{display:flex;gap:14px;justify-content:center;margin:0 0 14px}
.bodymap figure{margin:0;flex:none;text-align:center}
.bodymap svg{display:block;height:190px;width:auto;margin:0 auto}
.bodymap figcaption{font-size:13px;color:var(--mute);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.bodymap.big{gap:26px;margin:4px 0 16px}
.bodymap.big svg{height:44vh;height:clamp(230px,calc(100dvh - 345px),440px);transition:height .2s}
.bp{fill:#2f2d27}
.bp2{fill:#463d36;stroke:#1C1B17;stroke-width:1;stroke-linejoin:round}
.ln{fill:none;stroke:#1C1B17;stroke-width:1;stroke-linecap:round}
.m{fill:#7b4a40;stroke:#1C1B17;stroke-width:1;stroke-linejoin:round}
.m.tap{cursor:pointer}
.m.sel,.m.main{fill:#DB9928}
.m.helps{fill:#8a6524}
.m.dim,.m.off{fill:#463d36}
.mlist .lab{margin:14px 0 8px}
.mlist .row{min-height:64px;padding:10px 14px;margin-bottom:10px}
.mlist .row .name{font-size:19px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin:0 0 6px}
.mname{font-size:26px;font-weight:800;color:var(--gold);line-height:1.15;margin:0}
.mfull{display:block;font-size:14px;font-weight:600;color:var(--mute);margin:2px 0 0}
.allbtn{flex:none;min-height:44px;padding:0 16px;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.allbtn.on{background:var(--gold);color:#1C1B17}
.picking .mtop{position:sticky;top:-20px;z-index:2;background:var(--bg);margin:-20px -20px 0;padding:20px 20px 2px}
.picking .bodymap.big svg{height:30vh;height:clamp(180px,calc(100dvh - 604px),340px)}
.mall .lab{font-size:12px;margin:8px 0 6px}
.mall .chips{margin:0 0 4px}
.mall .chip{min-height:40px;padding:0 10px;font-size:15px}
.mline{font-size:18px;line-height:1.45;margin:0 0 6px}
.m.tap:focus{outline:none}
.m.tap:focus-visible{outline:none;stroke:#FAF7F0;stroke-width:2.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid var(--gold-d);background:transparent;color:var(--text);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.chip.on,.chip.main{background:var(--gold);border-color:var(--gold);color:#1C1B17}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--mute);margin:0 0 12px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.note{font-size:16px;color:var(--mute);margin:8px 0 0}
.usebtn{display:block;min-height:48px;width:100%;margin:-4px 0 14px;border:0;border-radius:12px;background:var(--gold);color:#1C1B17;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>

    {q:"Why am I sore, and what should I do about it?",a:null}
  ];
  var state = {tab:"workouts", libMode:"gym", openFrom:null, scroll:{}, workout:loadWorkout(), muscle:"quads"};
  function loadWorkout(){
    var w = null;
    try{ w = JSON.parse(localStorage.getItem("mm_workout_v1")); }catch(err){ w = null; }
    var ok = Array.isArray(w) && w.length===DEFAULT_WORKOUT.length;
    if(ok){ for(var i=0;i<DEFAULT_WORKOUT.length;i++){ if(typeof w[i]!=="string" || SLOTS[i].indexOf(w[i])<0){ ok=false; break; } } }
    return ok ? w : DEFAULT_WORKOUT.slice();
  }
  function saveWorkout(){ try{ localStorage.setItem("mm_workout_v1", JSON.stringify(state.workout)); }catch(err){} }
  function setWorkoutMove(i, id){ state.workout[i] = id; saveWorkout(); renderWorkouts(); }
  function slotOf(id){ for(var i=0;i<SLOTS.length;i++){ if(SLOTS[i].indexOf(id)>=0) return i; } return -1; }
  function sameAsDefault(){ for(var i=0;i<DEFAULT_WORKOUT.length;i++){ if(state.workout[i]!==DEFAULT_WORKOUT[i]) return false; } return true; }
  var $ = function(id){return document.getElementById(id);};

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  
  function moveRow(id,from,small){
    return '<button class="row" data-move="'+id+'" data-from="'+from+'"><div class="info"><div class="name">'+esc(MOVES[id].name)+'</div></div><div class="chev">&rsaquo;</div></button>';
  }
  function renderWorkouts(){
    var h = '<h2>Your starting workout</h2>';
    h += '<p>This is where we recommend you start. If you prefer a different move, tap Swap and trade it in.</p>';
    h += '<div class="rule"><p class="rx">3 sets of 8 to 12 reps</p><p>Twice a week.</p><p>Make your sets hard.</p><button class="asklink" data-hard="1">What is a hard set?</button></div>';
    state.workout.forEach(function(id,i){
      var m = MOVES[id];
      var hasSwap = SLOTS[i].length>1;
      h += '<div class="mcard"><button class="row" data-move="'+id+'" data-from="workouts">'
        + '<div class="info"><div class="num">Move '+(i+1)+'</div><div class="name">'+esc(m.name)+'</div></div>'
        + '<div class="chev">&rsaquo;</div></button>';
      if(hasSwap) h += '<button class="swapbtn" data-swap="'+id+'" aria-expanded="false">Swap</button>';
      h += '</div>';
      if(hasSwap){
        h += '<div class="swappanel" id="swap-'+id+'">';
        SLOTS[i].forEach(function(x){
          if(x===id) return;
          h += moveRow(x,"workouts");
          h += '<button class="usebtn" data-use="'+x+'" data-slot="'+i+'">Use this instead</button>';
        });
        h += '</div>';
      }
    });
    h += '<div class="group"><h3>Want more?</h3><p>Add one of these after your three moves.</p>';
    MORE.forEach(function(id){ if(state.workout.indexOf(id)<0) h += moveRow(id,"workouts"); });
    h += '</div>';
    if(!sameAsDefault()) h += '<button class="link" data-reset="1">Back to the starting workout</button>';
    if(QUESTION_FORM_ID) h += '<div class="askline"><button class="asklink" data-ask="1">Have a question? Ask us</button></div>';
    $("s-workouts").innerHTML = h;
  }

  function renderMuscles(){
    var clsOf = function(id){ var mv = movesFor(id); return (!mv.main.length && !mv.helps.length) ? "off" : ""; };
    var h = '<div class="mtop">';
    h += '<div class="bodymap big"><figure><figcaption>Front</figcaption>'+bodySvg("front",clsOf,true)+'</figure><figure><figcaption>Back</figcaption>'+bodySvg("back",clsOf,true)+'</figure></div>';
    h += '<div class="mhead"><div class="mname" aria-live="polite"><span id="muscle-name"></span><span class="mfull" id="muscle-full"></span></div>';
    h += '<button class="allbtn" id="all-btn" data-all="1" aria-expanded="false">All muscles</button></div></div>';
    h += '<div id="muscle-detail"><p class="mline" id="muscle-line"></p><div class="mlist" id="muscle-list"></div></div>';
    h += '<div class="mall" id="muscle-all" hidden>';
    MUSCLE_GROUPS.forEach(function(g){
      var ids = g[1].filter(function(id){ return clsOf(id)!=="off"; });
      if(!ids.length) return;
      h += '<div class="lab">'+g[0]+'</div><div class="chips">';
      ids.forEach(function(id){ h += '<button class="chip" data-muscle="'+id+'">'+esc(MUSCLES[id].name)+'</button>'; });
      h += '</div>';
    });
    h += '</div>';
    $("s-muscles").innerHTML = h;
    updateMuscle();
  }
  // Updates the Muscles tab in place, so the page never moves when a muscle is picked.
  function updateMuscle(){
    var scr = $("s-muscles"), id = state.muscle, sel = MUSCLES[id], mv = movesFor(id);
    Array.prototype.forEach.call(scr.querySelectorAll(".m[data-muscle]"), function(n){ n.classList.toggle("sel", n.getAttribute("data-muscle")===id); });
    Array.prototype.forEach.call($("muscle-all").querySelectorAll(".chip"), function(n){ var is = n.getAttribute("data-muscle")===id; n.classList.toggle("on", is); n.setAttribute("aria-pressed", is ? "true" : "false"); });
    $("muscle-name").textContent = sel.name;
    $("muscle-full").textContent = sel.full ? "short for "+sel.full : "";
    $("muscle-line").textContent = sel.line;
    var h = "";
    if(mv.main.length){ h += '<div class="lab">Moves that train it</div>'; mv.main.forEach(function(m){ h += moveRow(m,"muscles"); }); }
    if(mv.helps.length){ h += '<div class="lab">Moves that also help</div>'; mv.helps.forEach(function(m){ h += moveRow(m,"muscles"); }); }
    $("muscle-list").innerHTML = h;
  }
  // "All muscles" swaps the space under the figures between the list of names and the selected muscle's details.
  function setPicking(on){
    var was = !!state.picking;
    state.picking = !!on;
    if(!was && state.picking) pushLayer();
    if(was && !state.picking) popLayer();
    var scr = $("s-muscles"), btn = $("all-btn");
    scr.classList.toggle("picking", state.picking);
    $("muscle-all").hidden = !state.picking;
    $("muscle-detail").hidden = state.picking;
    btn.textContent = state.picking ? "Done" : "All muscles";
    btn.classList.toggle("on", state.picking);
    btn.setAttribute("aria-expanded", state.picking ? "true" : "false");
    scr.scrollTop = 0;
  }

  function renderLibrary(){
    var h = '<div class="section-label">Moms &amp; Machines</div>';
    h += '<div class="seg">'+LIBMODES.map(function(m){return '<button data-mode="'+m[0]+'" class="'+(state.libMode===m[0]?"on":"")+'">'+m[1]+'</button>';}).join("")+'</div>';
    function libRow(id){ return '<button class="row" data-move="'+id+'" data-from="library"><img class="vthumb" src="https://i.ytimg.com/vi/'+MOVES[id].url+'/mqdefault.jpg" alt="" width="56" height="56" loading="lazy" onerror="this.style.display=\'none\'"><div class="info"><div class="name">'+esc(MOVES[id].name)+'</div></div><div class="chev">&rsaquo;</div></button>'; }
    if(state.libMode==="gym"){
      AREAS.forEach(function(area){
        var ids = Object.keys(MOVES).filter(function(id){return MOVES[id].area===area && MOVES[id].set==="gym";});
        if(!ids.length) return;
        h += '<div class="group"><h3>'+area+'</h3>';
        ids.forEach(function(id){ h += libRow(id); });
        h += '</div>';
      });
    } else {
      if(state.libMode==="extras") h += '<p>These loosen you up. They are worth doing, and they do not replace the workout.</p>';
      Object.keys(MOVES).filter(function(id){return MOVES[id].set===state.libMode;}).forEach(function(id){ h += libRow(id); });
    }
    $("s-library").innerHTML = h;
  }

  function renderBasics(){
    var h = '<h2>The basics</h2>';
    if(QUESTION_FORM_ID) h += '<div class="q"><h3>Ask us a question</h3><p>Send us your question. Phillip or Mitchell will email you back.</p><button class="link" data-ask="1">Ask us a question</button></div>';
    BASICS.forEach(function(b){
      if(!b.a) return;
      h += '<div class="q"'+(b.id?' id="basics-'+b.id+'"':'')+'><h3>'+esc(b.q)+'</h3>';
      h += '<p>'+esc(b.a)+'</p></div>';
    });
    h += '<div class="q"><h3>Put this on your home screen</h3>'+hsBlock()+'</div>';
    $("s-basics").innerHTML = h;
  }

  // Back gesture: every layer you can open (a move page, the question box, the home screen steps,
  // the All muscles list) can be closed by swiping in from the left edge or by the phone's back button.
  var hist = 0, ignorePop = 0, fromPop = false;
  function pushLayer(){ try{ history.pushState({mm:1}, ""); hist++; }catch(err){} }
  function popLayer(){
    if(fromPop || hist < 1) return;
    hist--; ignorePop++;
    try{ history.back(); }catch(err){ ignorePop--; }
  }
  function goBack(){
    if($("overlay").classList.contains("on")){
      if($("ov-close")){ try{ localStorage.setItem(HS_KEY,"1"); }catch(err){} }
      closeOverlay(); return true;
    }
    if($("move").classList.contains("on")){ closeMove(); return true; }
    if(state.picking && state.tab==="muscles"){ setPicking(false); return true; }
    return false;
  }
  window.addEventListener("popstate", function(){
    if(ignorePop > 0){ ignorePop--; return; }
    if(hist > 0) hist--;
    fromPop = true;
    try{ goBack(); }finally{ fromPop = false; }
  });
  (function(){
    var sx = 0, sy = 0, st = 0, edge = false;
    document.addEventListener("touchstart", function(e){
      var t = e.touches && e.touches[0];
      edge = !!t && e.touches.length === 1 && t.clientX <= 24;
      if(edge){ sx = t.clientX; sy = t.clientY; st = Date.now(); }
    }, {passive:true});
    document.addEventListener("touchend", function(e){
      if(!edge) return; edge = false;
      var t = e.changedTouches && e.changedTouches[0]; if(!t) return;
      var dx = t.clientX - sx, dy = Math.abs(t.clientY - sy);
      if(dx >= 70 && dy <= dx * 0.6 && Date.now() - st < 800){
        fromPop = true;
        try{ goBack(); }finally{ fromPop = false; }
      }
    }, {passive:true});
  })();

  function openMove(id, from){
    var m = MOVES[id]; if(!m) return;
    var scr = $("s-"+from);
    state.scroll[from] = scr.scrollTop;
    state.openFrom = from;
    var t = TARGETS[id], h = '';
    h += '<button class="back" id="back-btn">&lsaquo; Back to '+(from==="workouts"?"workout":(from==="muscles"?"muscles":"library"))+'</button>'
      + '<h2>'+esc(m.name)+'</h2>'
      + (m.url ? '<div class="yt"><div class="ytbox"><iframe src="https://www.youtube.com/embed/'+m.url+'?rel=0&playsinline=1" title="'+esc(m.name)+' video" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><a class="ytlink" href="https://www.youtube.com/shorts/'+m.url+'" target="_blank" rel="noopener">Watch on YouTube</a></div>' : '')
      + '<div class="lab">What it works</div><p class="big">'+esc(m.works)+'</p>';
    if(t){
      var clsOf = function(mid){ return t.main.indexOf(mid)>=0 ? "main" : (t.helps.indexOf(mid)>=0 ? "helps" : "dim"); };
      h += '<div class="bodymap mini"><figure><figcaption>Front</figcaption>'+bodySvg("front",clsOf,false)+'</figure><figure><figcaption>Back</figcaption>'+bodySvg("back",clsOf,false)+'</figure></div>';
      h += '<div class="legend"><span><i style="background:#DB9928"></i>Does most of the work</span>'
        + (t.helps.length ? '<span><i style="background:#8a6524"></i>Helps</span>' : '') + '</div>';
      h += '<div class="chips">';
      t.main.forEach(function(mid){ h += '<button class="chip main" data-muscle="'+mid+'">'+esc(MUSCLES[mid].name)+'</button>'; });
      t.helps.forEach(function(mid){ h += '<button class="chip" data-muscle="'+mid+'">'+esc(MUSCLES[mid].name)+'</button>'; });
      h += '</div>';
    }
    var si = slotOf(id);
    if(si>=0){
      if(state.workout[si]!==id){
        h += '<button class="link" data-use="'+id+'" data-slot="'+si+'" data-go="1" style="margin-top:12px">Swap into my workout</button>'
          + '<p class="note">This replaces '+esc(MOVES[state.workout[si]].name)+'.</p>';
      } else {
        h += '<p class="note">This move is in your workout.</p>';
      }
    }
    $("move").innerHTML = h;
    if(!$("move").classList.contains("on")) pushLayer();
    $("move").classList.add("on");
    $("move").scrollTop = 0;
    $("back-btn").addEventListener("click", closeMove);
  }
  function closeMove(){
    if($("move").classList.contains("on")) popLayer();
    $("move").classList.remove("on"); $("move").innerHTML = "";
    var from = state.openFrom;
    if(from){ $("s-"+from).scrollTop = state.scroll[from] || 0; }
    state.openFrom = null;
  }
  function showTab(t){
    if($("move").classList.contains("on")) { popLayer(); $("move").classList.remove("on"); $("move").innerHTML = ""; state.openFrom=null; }
    state.tab = t;
    ["workouts","library","muscles","basics"].forEach(function(n){ $("s-"+n).classList.toggle("on", n===t); });
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){ b.classList.toggle("on", b.getAttribute("data-tab")===t); });
  }
  var toastTimer;
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove("on");},1800); }

  document.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("[data-tab],[data-move],[data-mode],[data-swap],[data-use],[data-reset],[data-muscle],[data-all]") : null;
    if(!el) return;
    if(el.hasAttribute("data-swap")){
      var id = el.getAttribute("data-swap"), pn = $("swap-"+id), on = !pn.classList.contains("on");
      pn.classList.toggle("on", on); el.classList.toggle("on", on); el.setAttribute("aria-expanded", on);
      el.textContent = "Swap";
    }
    else if(el.hasAttribute("data-tab")) showTab(el.getAttribute("data-tab"));
    else if(el.hasAttribute("data-move")) openMove(el.getAttribute("data-move"), el.getAttribute("data-from"));
    else if(el.hasAttribute("data-mode")){
      state.libMode = el.getAttribute("data-mode");
      renderLibrary(); $("s-library").scrollTop = 0;
    }
    else if(el.hasAttribute("data-use")){
      var uid = el.getAttribute("data-use"), us = parseInt(el.getAttribute("data-slot"),10);
      setWorkoutMove(us, uid);
      if(el.hasAttribute("data-go")) showTab("workouts");
      toast(MOVES[uid].name+" is in your workout now");
    }
    else if(el.hasAttribute("data-reset")){
      state.workout = DEFAULT_WORKOUT.slice(); saveWorkout(); renderWorkouts();
      toast("Starting workout restored");
    }
    else if(el.hasAttribute("data-all")) setPicking(!state.picking);
    else if(el.hasAttribute("data-muscle")) pickMuscle(el, false);
  });
  function pickMuscle(el, byKey){
    if(!(state.tab==="muscles" || $("move").classList.contains("on"))) return;
    var fromMove = $("move").classList.contains("on");
    state.muscle = el.getAttribute("data-muscle");
    showTab("muscles");
    updateMuscle();
    if(fromMove) setPicking(false);
    if(byKey){ var f = $("s-muscles").querySelector(".m.sel.tap[tabindex]"); if(f && f.focus) f.focus(); }
  }
  document.addEventListener("keydown", function(e){
    var t = e.target;
    if(!t || !t.getAttribute || !t.hasAttribute("data-muscle") || t.tagName==="BUTTON") return;
    if(e.key==="Enter" || e.key===" " || e.key==="Spacebar"){ e.preventDefault(); pickMuscle(t, true); }
  });

  renderWorkouts(); renderLibrary(); renderMuscles(); renderBasics();

  // Overlay: used for the home screen steps and the question form.
  function isStandalone(){
    try{ if(window.navigator.standalone===true) return true; }catch(err){}
    try{ if(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true; }catch(err){}
    return false;
  }
  function platform(){
    var ua = navigator.userAgent || "";
    if(/iPhone|iPad|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1)) return "ios";
    if(/Android/.test(ua)) return "android";
    return "other";
  }
  function stepsHtml(){
    var ios = '<h4>iPhone</h4><ol class="steps">'
      + '<li>Open this page in Safari.</li>'
      + '<li>Tap the Share button. It is the square with an arrow pointing up, at the bottom of the screen.</li>'
      + '<li>Scroll down and tap Add to Home Screen.</li>'
      + '<li>Tap Add, in the top right corner.</li></ol>';
    var and = '<h4>Android</h4><ol class="steps">'
      + '<li>Open this page in Chrome.</li>'
      + '<li>Tap the three dots in the top right corner.</li>'
      + '<li>Tap Add to Home screen, or Install app.</li>'
      + '<li>Tap Add, or Install.</li></ol>';
    var p = platform();
    return p==="ios" ? ios : (p==="android" ? and : ios+and);
  }
  function hsBlock(){
    return '<div class="hs"><img class="hs-icon" src="muscle-mix-icon-180.png" alt="">'
      + '<p>Then you can open the app with one tap, like any other app on your phone.</p>'+stepsHtml()+'</div>';
  }
  function openOverlay(html){ var o=$("overlay"); if(!o.classList.contains("on")) pushLayer(); o.innerHTML=html; o.classList.add("on"); o.scrollTop=0; }
  function closeOverlay(){ var o=$("overlay"); if(o.classList.contains("on")) popLayer(); o.classList.remove("on"); o.innerHTML=""; }
  function showHomeScreen(){
    openOverlay('<h2>Put this on your home screen</h2>'+hsBlock()+'<button class="link" id="ov-close">Got it</button>');
    $("ov-close").addEventListener("click", function(){ try{ localStorage.setItem(HS_KEY,"1"); }catch(err){} closeOverlay(); });
  }
  function showQuestion(){
    openOverlay('<button class="back" id="ov-back">&lsaquo; Back</button><h2>Ask us a question</h2>'
      + '<iframe src="https://tally.so/embed/'+encodeURIComponent(QUESTION_FORM_ID)+'?transparentBackground=1&hideTitle=1" title="Ask us a question"></iframe>');
    $("ov-back").addEventListener("click", closeOverlay);
  }
  document.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("[data-ask]") : null;
    if(el){ showQuestion(); }
    var hd = e.target.closest ? e.target.closest("[data-hard]") : null;
    if(hd){
      showTab("basics");
      var card = $("basics-hard");
      if(card) $("s-basics").scrollTop = Math.max(0, card.offsetTop - 12);
    }
  });
  // Show the steps once, on first open, unless the app is already on the home screen.
  (function(){
    if(isStandalone()) return;
    try{ if(localStorage.getItem(HS_KEY)) return; }catch(err){}
    showHomeScreen();
  })();
})();
</script>
</body>
</html>
