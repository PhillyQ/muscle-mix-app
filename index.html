<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muscle Mix</title>
<style>
:root{--bg:#1C1B17;--panel:#26251f;--line:#3a382f;--gold:#DB9928;--gold-d:rgba(219,153,40,.55);--text:#FAF7F0;--mute:#CDC7B8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:500px){#app{height:min(100dvh,880px);margin-top:max(0px,calc((100dvh - 880px)/2));border:1px solid var(--line);border-radius:28px}}
header.top{padding:calc(16px + env(safe-area-inset-top)) 20px 12px;border-bottom:1px solid var(--line);flex:none}
header.top h1{margin:0;line-height:0}header.top .logo{height:46px;width:auto;display:block}
main{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;padding:20px 20px 28px;display:none}
.screen.on{display:block}
h2{font-size:24px;color:var(--gold);margin:0 0 14px;line-height:1.2}
.section-label{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 14px}
p{font-size:18px;line-height:1.45;margin:0 0 12px}
.rule{background:var(--panel);border:1px solid var(--gold-d);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.rule p{margin:0 0 8px}
.ph{border:2px dashed rgba(205,199,184,.5);border-radius:10px;padding:10px 12px;color:#CDC7B8;background:rgba(219,153,40,.07);font-size:15px;line-height:1.35;font-style:italic}
.row{display:flex;gap:14px;align-items:center;width:100%;min-height:92px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px;color:var(--text);font:inherit;cursor:pointer}
.row:active{border-color:var(--gold)}
.thumb{flex:none;width:72px;height:72px;border-radius:12px;background:repeating-linear-gradient(45deg,#2b2a24,#2b2a24 8px,#23221d 8px,#23221d 16px);border:1px solid #3a382f;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mute)}
.row .info{flex:1;min-width:0}
.row .num{color:var(--gold);font-weight:800;font-size:15px}
.row .name{font-size:20px;font-weight:700;line-height:1.2}
.row .ph{margin-top:6px;padding:4px 8px;font-size:13px}
.chev{flex:none;color:var(--gold);font-size:26px;padding-right:4px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:20px}
.seg button{flex:1;min-height:60px;border:0;border-radius:10px;background:transparent;color:var(--mute);font:inherit;font-size:16px;line-height:1.15;padding:4px 6px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--gold);color:#1C1B17}
.group h3{font-size:20px;color:var(--gold);margin:20px 0 10px;text-transform:uppercase;letter-spacing:1.5px}
.group .row{min-height:72px}
.group .row .name{font-size:20px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.q h3{margin:0 0 8px;font-size:21px;line-height:1.25;color:var(--gold)}
.q p{margin:0 0 10px}
.link{display:flex;align-items:center;justify-content:center;min-height:52px;width:100%;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-top:6px}
.link{text-decoration:none}
.swapbtn{display:block;min-height:48px;margin:-4px 0 12px auto;padding:0 22px;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.swapbtn.on{background:var(--gold);color:#1C1B17}
.swappanel{display:none;margin:0 0 16px;padding:0 0 4px 12px;border-left:3px solid var(--gold-d)}
.swappanel.on{display:block}
.swappanel .row{min-height:64px;margin-bottom:10px}
.swappanel .ph{margin-bottom:10px}
.swappanel p{font-size:17px}
.link:active{background:var(--gold);color:#1C1B17}
#move{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:12px 20px 28px;display:none;z-index:5}
#move.on{display:block}
.back{display:flex;align-items:center;gap:6px;min-height:52px;padding:0 18px 0 10px;margin:0 0 12px -6px;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);font:inherit;font-size:19px;font-weight:700;cursor:pointer}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:1px solid #333;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;color:var(--mute);font-size:16px}
.video .play{width:64px;height:64px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center}
.lab{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin:18px 0 6px}
.big{font-size:21px;line-height:1.4;margin:0}
nav{flex:none;display:flex;border-top:1px solid var(--line);background:#0f0f0f;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;color:var(--mute);font:inherit;font-size:15px;font-weight:700;letter-spacing:.5px;cursor:pointer}
nav button svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
#toast{position:absolute;left:20px;right:20px;bottom:96px;background:var(--gold);color:#1C1B17;font-weight:700;font-size:16px;padding:12px 14px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
</style>
</head>

    "starfish":{name:"Starfish",set:"home",works:"The muscles around your middle.",url:"DeQXZwjEc6C"},
    "plank":{name:"Plank",set:"home",works:"The muscles across your stomach, your back and your shoulders.",url:null},
    "chair-sit-to-stand":{name:"Chair sit to stand",set:"home",works:"The muscles of your thighs and buttocks.",url:"Dfo6MfQBzVa"},
    "squat-prep":{name:"Squat prep",set:"extras",works:"A warm-up that loosens your ankles, knees and hips before you squat.",url:"DedBa-PD-h8"},
    "deep-squat-hold":{name:"Deep squat hold",set:"extras",works:"You sit low in a squat and rock gently side to side. It loosens your ankles, knees and hips.",url:"Deud3DZjn3G"},
    "mini-trampoline":{name:"Mini trampoline",set:"extras",works:"You stand on a small trampoline and bounce gently. It uses the muscles of your legs and feet.",url:"DfAhEYvPsBZ"}
  };
  var IG = "https://www.instagram.com/reel/";
  var WORKOUT = ["leg-press","chest-press","lat-pull","leg-curl"];
  var SWAPS = {
    "leg-press":{moves:["leg-extension","glute-machine"]},
    "leg-curl":{text:"The seated leg curl, if your gym has one and you prefer it."},
    "chest-press":{moves:["shoulder-press"]},
    "lat-pull":{text:"Assisted pull-ups or the seated row, if your gym has them."}
  };
  var MORE = ["shoulder-press","abs-machine"];
  var LIBMODES = [["gym","Gym machines"],["home","At home"],["extras","Mobility and extras"]];
  var AREAS = ["Legs","Push","Pull","Core"];
  var BASICS = [
    {q:"How many days a week should I lift?",a:"When you are starting out, the goal is the habit. Get in there two or three times a week and give each muscle a few hard sets."},
    {q:"What is a hard set?",a:"A hard set is one where the last few reps slow down and feel hard. Those last reps are what count."},
    {q:"How many reps should I do?",a:"You have a lot of freedom, as long as the last few reps are hard. For most people, keeping sets to fifteen reps or fewer works well."},
    {q:"How do I know when to stop for the day?",a:"If a weight you usually handle suddenly feels like a battle, you have likely run out of quality sets. Pack it up, rest, and come back in a couple of days."},
    {q:"Should I wait and start next Monday?",a:"Your muscles do not care what day it is. If starting on a Monday helps the habit stick, that can be worth it, but every day you wait is sets you do not get."},
    {q:"Why am I sore, and what should I do about it?",a:null}
  ];
  var state = {tab:"workouts", libMode:"gym", openFrom:null, scroll:{}};
  var $ = function(id){return document.getElementById(id);};

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function ph(text){return '<div class="ph">'+PH_PREFIX+esc(text)+'</div>';}

  function moveRow(id,from,small){
    return '<button class="row" data-move="'+id+'" data-from="'+from+'"><div class="info"><div class="name">'+esc(MOVES[id].name)+'</div></div><div class="chev">&rsaquo;</div></button>';
  }
  function renderWorkouts(){
    var h = '<h2>Your starting workout</h2>';
    h += '<p>This is where we recommend you start. If you prefer a different move, tap Swap and trade it in.</p>';
    h += '<div class="rule"><p>Start with two hard sets of each move, eight to twelve reps a set. When that feels routine, build to three sets. The last few reps should be hard.</p><p>Do this same workout two or three days a week.</p></div>';
    WORKOUT.forEach(function(id,i){
      var m = MOVES[id], sw = SWAPS[id];
      h += '<button class="row" data-move="'+id+'" data-from="workouts">'
        + '<div class="thumb">Doreen</div>'
        + '<div class="info"><div class="num">Move '+(i+1)+'</div><div class="name">'+esc(m.name)+'</div>'
        + '<div class="ph">'+PH_PREFIX+'one-line reminder</div></div>'
        + '<div class="chev">&rsaquo;</div></button>';
      h += '<button class="swapbtn" data-swap="'+id+'" aria-expanded="false">Swap</button>';
      h += '<div class="swappanel" id="swap-'+id+'">';
      if(sw.moves){ sw.moves.forEach(function(x){ h += moveRow(x,"workouts"); }); }
      else if(sw.text){ h += '<p>'+esc(sw.text)+'</p>'; }
      else if(sw.ph){ h += ph(sw.ph); }
      h += '</div>';
    });
    h += '<div class="group"><h3>Want more?</h3><p>Add one of these after your four moves.</p>';
    MORE.forEach(function(id){ h += moveRow(id,"workouts"); });
    h += '</div>';
    $("s-workouts").innerHTML = h;
  }

  function renderLibrary(){
    var h = '<div class="section-label">Moms &amp; Machines</div>';
    h += '<div class="seg">'+LIBMODES.map(function(m){return '<button data-mode="'+m[0]+'" class="'+(state.libMode===m[0]?"on":"")+'">'+m[1]+'</button>';}).join("")+'</div>';
    function libRow(id){ return '<button class="row" data-move="'+id+'" data-from="library"><div class="thumb" style="width:56px;height:56px">Doreen</div><div class="info"><div class="name">'+esc(MOVES[id].name)+'</div></div><div class="chev">&rsaquo;</div></button>'; }
    if(state.libMode==="gym"){
      AREAS.forEach(function(area){
        var ids = Object.keys(MOVES).filter(function(id){return MOVES[id].area===area && MOVES[id].set==="gym";});
        if(!ids.length) return;
        h += '<div class="group"><h3>'+area+'</h3>';
        ids.forEach(function(id){ h += libRow(id); });
        h += '</div>';
      });
    } else {
      if(state.libMode==="extras") h += '<p>These loosen you up. They are worth doing, and they do not replace the workout.</p>';
      Object.keys(MOVES).filter(function(id){return MOVES[id].set===state.libMode;}).forEach(function(id){ h += libRow(id); });
    }
    $("s-library").innerHTML = h;
  }

  function renderBasics(){
    var h = '<h2>The basics</h2>';
    BASICS.forEach(function(b){
      h += '<div class="q"><h3>'+esc(b.q)+'</h3>';
      if(b.a){ h += '<p>'+esc(b.a)+'</p>'; }
      else { h += ph("Phillip writes this answer (one or two sentences)"); h += '<div style="height:10px"></div>'; }
      h += '<button class="link" data-link="1">Watch the full video</button></div>';
    });
    $("s-basics").innerHTML = h;
  }

  function openMove(id, from){
    var m = MOVES[id]; if(!m) return;
    var scr = $("s-"+from);
    state.scroll[from] = scr.scrollTop;
    state.openFrom = from;
    $("move").innerHTML =
      '<button class="back" id="back-btn">&lsaquo; Back to '+(from==="workouts"?"workout":"library")+'</button>'
      + '<h2>'+esc(m.name)+'</h2>'
      + '<div class="video"><div class="play"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#1C1B17"/></svg></div>Moms &amp; Machines clip</div>'
      + '<div class="lab">What it works</div><p class="big">'+esc(m.works)+'</p>'
      + '<div class="lab">The one cue</div>'+ph("Phillip writes this cue (one line)")
      + (m.url ? '<a class="link" style="margin-top:22px" href="'+IG+m.url+'/" target="_blank" rel="noopener">Watch the full episode on Instagram</a>'
             : '<button class="link" data-link="1" style="margin-top:22px">Watch the full episode on Instagram</button>');
    $("move").classList.add("on");
    $("move").scrollTop = 0;
    $("back-btn").addEventListener("click", closeMove);
  }
  function closeMove(){
    $("move").classList.remove("on");
    var from = state.openFrom;
    if(from){ $("s-"+from).scrollTop = state.scroll[from] || 0; }
    state.openFrom = null;
  }
  function showTab(t){
    if($("move").classList.contains("on")) { $("move").classList.remove("on"); state.openFrom=null; }
    state.tab = t;
    ["workouts","library","basics"].forEach(function(n){ $("s-"+n).classList.toggle("on", n===t); });
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){ b.classList.toggle("on", b.getAttribute("data-tab")===t); });
  }
  var toastTimer;
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove("on");},1800); }

  document.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("[data-tab],[data-move],[data-mode],[data-link],[data-swap]") : null;
    if(!el) return;
    if(el.hasAttribute("data-swap")){
      var id = el.getAttribute("data-swap"), pn = $("swap-"+id), on = !pn.classList.contains("on");
      pn.classList.toggle("on", on); el.classList.toggle("on", on); el.setAttribute("aria-expanded", on);
      el.textContent = "Swap";
    }
    else if(el.hasAttribute("data-tab")) showTab(el.getAttribute("data-tab"));
    else if(el.hasAttribute("data-move")) openMove(el.getAttribute("data-move"), el.getAttribute("data-from"));
    else if(el.hasAttribute("data-mode")){
      state.libMode = el.getAttribute("data-mode");
      renderLibrary(); $("s-library").scrollTop = 0;
    }
    else if(el.hasAttribute("data-link")) toast("Placeholder link: video goes here later");
  });

  renderWorkouts(); renderLibrary(); renderBasics();
})();
</script>
</body>
</html>
